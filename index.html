<style>html,body{margin:0;height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one full-bleed living canvas; a brush-lettered title top-left, time-of-day seals bottom, a field-guide card follows the cursor. */
:root {
  --ink: #120b08;
  --paper: #f4e6cf;
  --paper-dim: rgba(244, 230, 207, 0.72);
  --glass: rgba(18, 11, 8, 0.55);
  --glass-edge: rgba(244, 230, 207, 0.18);
  --seal: #c8422b;
  --font-brush: "Ma Shan Zheng", "Noto Serif SC", "STKaiti", "KaiTi", serif;
  --font-text: "Noto Serif", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--font-text); overflow: hidden; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: crosshair; }

.title {
  position: fixed; left: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px 0 max(20px, env(safe-area-inset-left, 0px));
  pointer-events: none; display: grid; gap: 4px;
  text-shadow: 0 1px 12px rgba(0,0,0,0.45);
}
.title h1 { margin: 0; font-family: var(--font-brush); font-weight: 400; font-size: clamp(44px, 7vw, 76px); line-height: 1; letter-spacing: 0.04em; }
.title .sub { font-style: italic; font-size: 15px; color: var(--paper-dim); letter-spacing: 0.02em; }
.title .hint { font-size: 12.5px; color: var(--paper-dim); max-width: 34ch; line-height: 1.5; margin-top: 4px; }

.dock {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; gap: 6px; align-items: stretch;
  padding: 6px; border-radius: 14px;
  background: var(--glass); border: 1px solid var(--glass-edge);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  max-width: calc(100% - 32px);
}
.dock button {
  appearance: none; border: 0; background: transparent; color: var(--paper);
  display: grid; justify-items: center; gap: 1px; padding: 6px 10px 5px; border-radius: 9px;
  cursor: pointer; font-family: var(--font-text); min-width: 52px;
}
.dock button .zi { font-family: var(--font-brush); font-size: 26px; line-height: 1; }
.dock button .en { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--paper-dim); }
.dock button:hover { background: rgba(244,230,207,0.08); }
.dock button[aria-pressed="true"] { background: var(--seal); }
.dock button[aria-pressed="true"] .en { color: var(--paper); }
.dock button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
.dock .sep { width: 1px; background: var(--glass-edge); margin: 6px 2px; }

.card {
  position: fixed; left: 0; top: 0; pointer-events: none;
  display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center;
  padding: 12px 16px 13px 12px; border-radius: 12px; max-width: min(330px, calc(100vw - 32px));
  background: rgba(244, 230, 207, 0.96); color: var(--ink);
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  opacity: 0; transition: opacity .15s ease;
}
.card.on { opacity: 1; }
.card .big { grid-row: span 3; font-family: var(--font-brush); font-size: 54px; line-height: 1; color: var(--ink); writing-mode: horizontal-tb; }
.card .big.long { font-size: 38px; }
.card .py { font-size: 15px; font-weight: 600; }
.card .en { font-size: 13px; font-style: italic; opacity: .8; }
.card .note { grid-column: 1 / -1; font-size: 12.5px; line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(18,11,8,0.15); }

.worlds {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 4px; padding: 5px; border-radius: 12px;
  background: var(--glass); border: 1px solid var(--glass-edge);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.worlds button {
  appearance: none; border: 0; background: transparent; color: var(--paper); cursor: pointer;
  display: grid; justify-items: center; gap: 1px; padding: 5px 10px 4px; border-radius: 8px; font-family: var(--font-text);
}
.worlds button .zi { font-family: var(--font-brush); font-size: 22px; line-height: 1; }
.worlds button .en { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--paper-dim); }
.worlds button:hover { background: rgba(244,230,207,0.08); }
.worlds button[aria-pressed="true"] { background: rgba(244,230,207,0.16); box-shadow: inset 0 -2px 0 var(--seal); }
.worlds button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

@media (max-width: 520px) {
  .title .hint { display: none; }
  .worlds button { padding: 4px 7px 3px; }
  .worlds button .zi { font-size: 18px; }
  .dock button { min-width: 44px; padding: 5px 7px; }
  .dock button .zi { font-size: 22px; }
}
</style>

<canvas id="scene" aria-label="An animated savanna drawn entirely with Chinese characters"></canvas>

<div class="title">
  <h1 id="w-title">草原</h1>
  <div class="sub" id="w-sub">cǎoyuán · the savanna</div>
  <div class="hint" id="w-hint">Every shape here is a character. Hover one to read it, click to stir the herd, click the lion to hear it roar. Some fold into the animals they name; double-click one to see it.</div>
</div>

<nav class="worlds" aria-label="Worlds">
  <button data-world="savanna" aria-pressed="true"><span class="zi">草原</span><span class="en">Savanna</span></button>
  <button data-world="reef" aria-pressed="false"><span class="zi">珊瑚礁</span><span class="en">Coral reef</span></button>
  <button data-world="bamboo" aria-pressed="false"><span class="zi">竹林</span><span class="en">Bamboo</span></button>
  <button data-world="ice" aria-pressed="false"><span class="zi">冰原</span><span class="en">Ice</span></button>
</nav>

<nav class="dock" aria-label="Time of day">
  <button id="t-dawn" data-t="0.03" aria-pressed="false"><span class="zi">晨</span><span class="en">Dawn</span></button>
  <button id="t-day" data-t="0.2" aria-pressed="false"><span class="zi">昼</span><span class="en">Day</span></button>
  <button id="t-dusk" data-t="0.44" aria-pressed="false"><span class="zi">暮</span><span class="en">Dusk</span></button>
  <button id="t-night" data-t="0.7" aria-pressed="false"><span class="zi">夜</span><span class="en">Night</span></button>
  <span class="sep" aria-hidden="true"></span>
  <button id="t-pause" aria-pressed="false" aria-label="Pause the day cycle"><span class="zi" id="pause-zi">停</span><span class="en" id="pause-en">Pause</span></button>
</nav>

<div class="card" id="card" role="status" aria-live="polite">
  <div class="big" id="c-big"></div>
  <div class="py" id="c-py"></div>
  <div class="en" id="c-en"></div>
  <div></div>
  <div class="note" id="c-note"></div>
</div>

<script>
(() => {
const cvs = document.getElementById('scene');
const ctx = cvs.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Ma Shan Zheng","Noto Serif SC","STKaiti","KaiTi",serif';
const R = Math.random, PI = Math.PI, TAU = PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const WHITE = [255, 250, 240];

/* ---------- field guide ---------- */
const INFO = {
  sun:     ['日', 'rì', 'sun', 'Oracle-bone 日 is a circle with a dot at its center: the sun itself.'],
  moon:    ['月', 'yuè', 'moon', 'A crescent moon. The curve of the old form survives in the left stroke.'],
  star:    ['星', 'xīng', 'star', '日 on top, 生 below for the sound. Early forms drew several small suns.'],
  light:   ['光', 'guāng', 'light, rays', 'Old forms show fire held above a kneeling person.'],
  cloud:   ['云', 'yún', 'cloud', 'Early forms show vapor curling up into the sky.'],
  mountain:['山', 'shān', 'mountain', 'Three peaks, the middle one tallest. Kilimanjaro is 乞力马扎罗山.'],
  snow:    ['雪', 'xuě', 'snow', '雨 rain on top. The lower part comes from 彗, a broom: rain you can sweep up.'],
  hill:    ['丘', 'qiū', 'hill', 'Originally two small rises side by side.'],
  grass:   ['草', 'cǎo', 'grass', 'The 艹 on top is two tufts sprouting. 草原 cǎoyuán means grassland: the savanna.'],
  tree:    ['树', 'shù', 'tree', 'This flat-topped one is an acacia, 金合欢 jīnhéhuān. Its trunk is stacked 木 mù, tree or wood.'],
  elephant:['象', 'xiàng', 'elephant', 'Oracle-bone 象 is an elephant standing on end, trunk and all. It also means image or likeness.'],
  giraffe: ['长颈鹿', 'chángjǐnglù', 'giraffe', 'Literally long (长) neck (颈) deer (鹿). Read it top to bottom and it is the giraffe.'],
  zebra:   ['斑马', 'bānmǎ', 'zebra', 'A striped (斑) horse (马). Here every 马 is painted in stripes.'],
  lion:    ['狮', 'shī', 'lion', '犭 is the animal radical and 师 gives the sound. Click it to hear 吼.'],
  roar:    ['吼', 'hǒu', 'roar', '口 mouth on the left, 孔 on the right for the sound.'],
  gazelle: ['羚', 'líng', 'gazelle, antelope', '羊 the goat radical, 令 for the sound. Startle them and they pronk: stiff-legged leaps meant for a predator to see.'],
  bird:    ['鸟', 'niǎo', 'bird', 'A drawing of a bird, simplified from 鳥. You can still see the head and tail.'],
  vulture: ['鹫', 'jiù', 'vulture', '就 on top gives the sound; 鸟 below makes it a bird. They ride thermals in slow circles.'],
  water:   ['水', 'shuǐ', 'water', 'A central stream with ripples on either side.'],
  hippo:   ['河马', 'hémǎ', 'hippopotamus', 'A river (河) horse (马). The Greek hippopotamos means the same thing.'],
  rhino:   ['犀', 'xī', 'rhinoceros', 'Usually said 犀牛 xīniú, “rhino ox.” Look for 牛 at the bottom of the character.'],
  firefly: ['萤', 'yíng', 'firefly', '艹 grass above, 虫 insect below: the bug that glows in the grass.'],
  wind:    ['风', 'fēng', 'wind', 'Simplified from 風. Watch the grass bend when it passes.'],
  dust:    ['尘', 'chén', 'dust', '小 small over 土 earth.'],
};

/* ---------- palettes across the day ---------- */
const K = (o) => { const r = {}; for (const k in o) r[k] = hex(o[k]); return r; };
const KEYS = [
  K({ skyTop:'#2d3561', skyBot:'#eca27a', glow:'#ffb070', gTop:'#7d5c47', gBot:'#35261f', grassFar:'#8f6d4f', grassNear:'#2c1e17', ink:'#2a1c18', haze:'#b98a88', cloud:'#f3c0a8', water:'#f2b38c' }), // dawn
  K({ skyTop:'#4c8cc2', skyBot:'#eedcaa', glow:'#fff1bf', gTop:'#caa060', gBot:'#86622f', grassFar:'#cba55c', grassNear:'#6a4f22', ink:'#4a3222', haze:'#a9b9c4', cloud:'#fdf8ee', water:'#8fbfd6' }), // day
  K({ skyTop:'#3a1f4a', skyBot:'#f2873a', glow:'#ff7a2a', gTop:'#9a5829', gBot:'#28150d', grassFar:'#b8632a', grassNear:'#1d100a', ink:'#1a0e0a', haze:'#c96f4b', cloud:'#f7a078', water:'#f59a55' }), // dusk
  K({ skyTop:'#04060f', skyBot:'#1b2446', glow:'#7486c2', gTop:'#1c2131', gBot:'#07080d', grassFar:'#2a3246', grassNear:'#0a0c12', ink:'#0c0f17', haze:'#2c3553', cloud:'#3b4463', water:'#3a4a78' }), // night
];
function palette(t) {
  const p = ((t % 1) + 1) % 1 * 4, i = Math.floor(p) % 4, j = (i + 1) % 4;
  let f = p - Math.floor(p); f = f * f * (3 - 2 * f);
  const o = {}; for (const k in KEYS[0]) o[k] = mix(KEYS[i][k], KEYS[j][k], f);
  return o;
}

/* ---------- world state ---------- */
let W = 0, H = 0, U = 1, HOR = 0, DPR = 1;
let T = 0.4, time = 0, paused = false, target = null;
const CYCLE = reduce ? 480 : 260;
const gy = g => HOR + g * (H - HOR);
const ds = g => 0.3 + g * 1.0;

const stars = Array.from({ length: 70 }, () => ({ x: R(), y: R() * 0.9, ph: R() * TAU, sp: 0.5 + R() * 2, glyph: R() < 0.3, s: 0.6 + R() * 0.9 }));
const clouds = Array.from({ length: 3 }, (_, i) => ({
  x: i / 3 + R() * 0.1, y: 0.1 + R() * 0.3, spd: 0.004 + R() * 0.004,
  parts: Array.from({ length: 3 + (R() * 3 | 0) }, () => ({ dx: (R() - 0.5) * 140, dy: (R() - 0.5) * 20, s: 26 + R() * 30 })),
}));
const hillsFar = Array.from({ length: 9 }, (_, i) => ({ x: i / 8 + (R() - 0.5) * 0.04, s: 50 + R() * 60 }));
const hillsNear = Array.from({ length: 6 }, (_, i) => ({ x: i / 5 + (R() - 0.5) * 0.06, s: 60 + R() * 70 }));

function makeTree(x, g, s) {
  const leaves = Array.from({ length: 30 }, () => {
    const u = R() * 2 - 1, v = R();
    return { dx: u * 135, dy: -v * 34 - (1 - u * u) * 14, s: 22 + R() * 14, ph: R() * TAU, lift: v };
  }).sort((a, b) => a.lift - b.lift);
  return { type: 'tree', x, g, s, leaves };
}
const trees = [makeTree(0.36, 0.34, 1.05), makeTree(0.87, 0.16, 0.8), makeTree(0.05, 0.1, 0.7)];

const animals = [];
const add = (o) => { animals.push(Object.assign({ type: 'animal', phase: R() * TAU, spook: 0, speed: 0, dir: 1, gait: 2 }, o)); };
[[0.02, 0.5, 105], [0.1, 0.55, 118], [0.065, 0.53, 58]].forEach(([x, g, size]) => add({ kind: 'elephant', ch: '象', x, g, size, speed: 0.006, gait: 2.2, col: [110, 104, 98] }));
add({ kind: 'giraffe', x: 0.335, g: 0.36, size: 72, speed: 0, gait: 0.8, browse: true });
add({ kind: 'giraffe', x: 0.74, g: 0.42, size: 66, speed: 0.004, dir: 1, gait: 1.6 });
for (let i = 0; i < 4; i++) add({ kind: 'zebra', ch: '马', x: 0.5 + i * 0.045 + R() * 0.01, g: 0.6 + R() * 0.12, size: 58 + R() * 8, speed: 0.011, dir: -1, gait: 4 });
for (let i = 0; i < 3; i++) add({ kind: 'gazelle', ch: '羚', x: 0.82 + i * 0.035, g: 0.44 + R() * 0.07, size: 34, speed: 0.016, dir: 1, gait: 6, col: [176, 122, 64] });
add({ kind: 'lion', ch: '狮', x: 0.16, g: 0.8, size: 92, speed: 0, gait: 1.1, col: [198, 146, 72], roarAt: 45 });
add({ kind: 'rhino', ch: '犀', x: 0.72, g: 0.88, size: 96, speed: 0.0028, dir: -1, gait: 1.6, col: [112, 104, 96] });
const water = { type: 'water', x: 0.62, g: 0.24 };
const flowers = [[.24, .93], [.62, .9], [.86, .96]].map(([x, g]) => ({ type: 'flower', x, g, fold: {} }));
const hippo = { x: 0.6, ph: 0 };

const vultures = Array.from({ length: 2 }, (_, i) => ({ cx: 0.5 + i * 0.14, cy: 0.18 + i * 0.05, r: 40 + R() * 40, a: R() * TAU, sp: 0.25 + R() * 0.15 }));
let flocks = [];
const dust = [];
const roars = [];
const fireflies = Array.from({ length: 14 }, () => ({ x: R(), g: 0.3 + R() * 0.7, ph: R() * TAU, vx: (R() - 0.5) * 0.01, bob: R() * TAU }));

const grass = [];
function buildGrass() {
  grass.length = 0;
  const n = clamp(Math.round(W * 0.24), 150, 400);
  for (let i = 0; i < n; i++) {
    const g = 0.02 + Math.pow(R(), 0.55) * 1.1;
    grass.push({ x: R() * 1.04 - 0.02, g, s: 20 + R() * 20, ph: R() * TAU, shade: 0.82 + R() * 0.3 });
  }
  grass.sort((a, b) => a.g - b.g);
}

const gust = { x: -1, on: false, next: 6 };

/* ---------- patterns ---------- */
const zc = document.createElement('canvas'); zc.width = 32; zc.height = 32;
const gc = document.createElement('canvas'); gc.width = 40; gc.height = 40;
function zebraPattern(light, dark) {
  const z = zc.getContext('2d');
  z.fillStyle = rgba(light); z.fillRect(0, 0, 32, 32);
  z.fillStyle = rgba(dark); z.fillRect(0, 0, 15, 32);
  return ctx.createPattern(zc, 'repeat');
}
function giraffePattern(light, dark) {
  const z = gc.getContext('2d');
  z.fillStyle = rgba(light); z.fillRect(0, 0, 40, 40);
  z.fillStyle = rgba(dark);
  [[2, 2, 17, 15], [22, 3, 16, 16], [3, 21, 15, 17], [21, 22, 17, 16]].forEach(r => { z.beginPath(); z.roundRect ? z.roundRect(r[0], r[1], r[2], r[3], 4) : z.rect(...r); z.fill(); });
  return ctx.createPattern(gc, 'repeat');
}

/* ---------- drawing helpers ---------- */
// All glyphs are drawn from one 100px font, scaled per glyph (fast: no font re-parsing).
function glyph(ch, x, y, size, rot = 0, sx = 1, sy = 1, center = false) {
  const k = size / 100;
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.scale(k * sx, k * sy);
  ctx.fillText(ch, 0, center ? 50 : 0);
  ctx.restore();
}
let hits = [];
const hit = (id, x, y, r, pri = 1) => hits.push({ id, x, y, r, pri });

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cvs.clientWidth; H = cvs.clientHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  U = Math.max(0.62, Math.min(W, H * 1.7) / 1000);
  HOR = H * (W < 600 ? 0.56 : 0.6);
  buildGrass();
}

/* ---------- input ---------- */
let mx = -9999, my = -9999, hoverId = null, tapHold = 0;
// Hold-to-read: once the card shows a creature, it stays on that creature
// until the pointer moves again, so fast movers (fireflies, birds) can be read.
let lockId = null, lockX = 0, lockY = 0;
const unlockIfMoved = (x, y) => { if (lockId && Math.hypot(x - lockX, y - lockY) > 6) lockId = null; };
cvs.addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; unlockIfMoved(mx, my); });
cvs.addEventListener('pointerleave', () => { mx = my = -9999; lockId = null; });
cvs.addEventListener('pointerdown', e => {
  mx = e.clientX; my = e.clientY;
  lockId = null;
  if (e.pointerType !== 'mouse') tapHold = 1;
  stir(e.clientX, e.clientY);
});

function stir(x, y) {
  if (world === 'reef') { reefStir(x, y); return; }
  if (world === 'bamboo') { bambooStir(x, y); return; }
  if (world === 'ice') { iceStir(x, y); return; }
  const id = pick(x, y);
  const lion = animals.find(a => a.kind === 'lion');
  if (id === 'lion') { roar(lion); return; }
  // ripple of wind from the click
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * TAU;
    roars.push({ ch: '风', x, y, vx: Math.cos(a) * 90 * U, vy: Math.sin(a) * 60 * U, life: 1.1, max: 1.1, s: 22 * U, grow: 10 * U });
  }
  animals.forEach(a => {
    const ax = a.x * W, ay = gy(a.g);
    if (Math.hypot(ax - x, ay - y) < 260 * U && a.speed > 0) { a.spook = 3; if (a.kind !== 'elephant' && a.kind !== 'rhino') a.dir = ax > x ? 1 : -1; }
  });
  if (y < HOR) spawnFlock(x, y, true);
}
function roar(lion) {
  const x = lion.x * W, y = gy(lion.g) - lion.size * U * ds(lion.g) * 0.7;
  for (let i = 0; i < 8; i++) {
    const a = -PI * 0.1 - i / 7 * PI * 0.8;
    roars.push({ ch: '吼', x, y, vx: Math.cos(a) * 140 * U, vy: Math.sin(a) * 110 * U, life: 2.4, max: 2.4, s: 26 * U, grow: 30 * U });
  }
  lion.roaring = 1.2;
  lion.roarAt = time + 70 + R() * 40;
  animals.forEach(a => { if (a.kind === 'gazelle' || a.kind === 'zebra') { a.spook = 4; a.dir = a.x * W > x ? 1 : -1; } });
  spawnFlock(x + 60 * U, HOR - 40 * U, true);
}
function spawnFlock(x, y, scatter) {
  const n = scatter ? 7 : 3 + (R() * 3 | 0);
  const dir = scatter ? (x < W / 2 ? 1 : -1) : (R() < 0.5 ? 1 : -1);
  const members = Array.from({ length: n }, (_, i) => {
    const row = Math.ceil(i / 2), side = i % 2 ? 1 : -1;
    return scatter
      ? { ox: (R() - 0.5) * 30, oy: (R() - 0.5) * 30, vx: (R() * 0.8 + 0.6) * dir, vy: -(R() * 0.9 + 0.2), ph: R() * TAU, s: 14 + R() * 8 }
      : { ox: -row * 26 * dir, oy: row * 14 * side, vx: 0, vy: 0, ph: R() * TAU, s: 15 + R() * 7 };
  });
  flocks.push({ x: scatter ? x : (dir > 0 ? -60 : W + 60), y: scatter ? y : HOR * (0.15 + R() * 0.35), vx: dir * (55 + R() * 25), vy: (R() - 0.5) * 6, scatter, members, age: 0 });
}

const card = document.getElementById('card');
const cBig = document.getElementById('c-big'), cPy = document.getElementById('c-py'), cEn = document.getElementById('c-en'), cNote = document.getElementById('c-note');
function pick(x, y) {
  let best = null, bd = Infinity;
  for (const h of hits) {
    const d = Math.hypot(h.x - x, h.y - y);
    if (d < h.r) { const score = d / h.r * h.pri; if (score < bd) { bd = score; best = h.id; } }
  }
  if (!best && world === 'savanna' && y > HOR) best = 'grass';
  return best;
}
function showCard(id) {
  if (id !== hoverId) {
    hoverId = id;
    if (id) {
      const [ch, py, en, note] = INFO[id];
      cBig.textContent = ch; cBig.classList.toggle('long', ch.length > 1);
      cPy.textContent = py; cEn.textContent = en; cNote.textContent = note;
    }
  }
  card.classList.toggle('on', !!id);
  if (id) {
    const r = card.getBoundingClientRect();
    let x = mx + 18, y = my + 18;
    if (x + r.width > W - 12) x = mx - r.width - 18;
    if (y + r.height > H - 12) y = my - r.height - 18;
    card.style.transform = `translate(${Math.max(12, x)}px, ${Math.max(12, y)}px)`;
  }
}

function syncPause() {
  pauseBtn.setAttribute('aria-pressed', String(paused));
  document.getElementById('pause-zi').textContent = paused ? '行' : '停';
  document.getElementById('pause-en').textContent = paused ? 'Play' : 'Pause';
  pauseBtn.setAttribute('aria-label', paused ? 'Resume the day cycle' : 'Pause the day cycle');
}
pauseBtn.addEventListener('click', () => { paused = !paused; target = null; syncPause(); });
function syncPhase() {
  const t = ((T % 1) + 1) % 1;
  const idx = t < 0.12 || t > 0.93 ? 0 : t < 0.36 ? 1 : t < 0.58 ? 2 : 3;
  btns.forEach((b, i) => b.setAttribute('aria-pressed', String(i === idx)));
}

}

  ctx.fillStyle = rgba(tint(P.rock, .8)); glyph('石', orx, FLOOR + 14 * U, 120 * U, 0, 1.3, 1);
  hit('rock', orx, FLOOR - 30 * U, 50 * U, 1.3);
  const [opx, opy] = octoPos(), jetting = time - reef.octo.jetAt < 2.5;
  const camo = jetting ? 1 : .5 + .5 * Math.sin(time * .45);
  const ocol = tint(mix(mix(P.rock, [150, 140, 130], .3), [226, 86, 58], camo));
  ctx.strokeStyle = rgba(ocol); ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    const bx = opx + (i - 3.5) * 7 * U, by = opy + 16 * U, sw = Math.sin(time * 2 + i) * 10 * U, sp2 = (i - 3.5) * 9 * U;
    ctx.lineWidth = 5 * U;
    ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx + sp2 + sw, by + 30 * U, bx + sp2 * 1.8 - sw * .5, by + (jetting ? 30 : 52) * U + Math.cos(time * 1.5 + i) * 6 * U);
    ctx.stroke();
  }
  ctx.fillStyle = rgba(ocol); glyph('章', opx, opy, 54 * U, Math.sin(time * .8) * .05, 1, 1.05 + .04 * Math.sin(time * 2), true);
  hit('octopus', opx, opy + 10 * U, 45 * U, .7);

  /* anemone and clownfish */
  const [ax, ay] = anemonePos();
  ctx.fillStyle = rgba(tint(P.rock, .8)); glyph('石', ax, FLOOR + 14 * U, 110 * U, 0, 1.4, .95);
  for (let i = 0; i < 18; i++) {
    const a = -PI * .95 + i / 17 * PI * .9, sw = Math.sin(time * 1.3 + i * .6) * .25;
    const len = (46 + (i % 3) * 8) * U;
    ctx.strokeStyle = rgba(tint(mix([196, 100, 190], [255, 190, 230], (i % 4) / 4)));
    ctx.lineWidth = 5 * U;
    ctx.beginPath(); ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(ax + Math.cos(a + sw) * len * .6, ay + Math.sin(a + sw) * len * .6 - 6 * U, ax + Math.cos(a + sw * 1.6) * len, ay + Math.sin(a + sw * 1.6) * len);
    ctx.stroke();
  }
  ctx.fillStyle = rgba(tint([236, 150, 206])); glyph('葵', ax, ay + 2 * U, 36 * U, 0, 1, 1, true);
  hit('anemone', ax, ay - 16 * U, 52 * U, 1.1);
  const hide = clamp(1 - (time - reef.clownHide - 3) / 1, 0, 1) * clamp((time - reef.clownHide) / .3, 0, 1);
  ctx.fillStyle = clownPattern(tint([255, 128, 40]), tint([255, 250, 240]), tint([30, 20, 20]));
  for (const c of reef.clowns) {
    const cx = ax + Math.cos(time * 1.1 + c.ph) * 44 * U * (1 - hide), cy = ay - 34 * U + Math.sin(time * 2.2 + c.ph) * 14 * U * (1 - hide) + hide * 24 * U;
    ctx.globalAlpha = 1 - hide * .6;
    glyph('鱼', cx, cy, 24 * U, 0, 1 + .06 * Math.sin(time * 12 + c.ph), 1, true);
    ctx.globalAlpha = 1;
    hit('clownfish', cx, cy, 18 * U, .7);
  }

  /* corals */
  for (const c of reef.corals) drawCoral(c, tint);

  /* crab and shrimp */
  const cx = (reef.crab.c + Math.sin(time * .22) * .1) * W, cy = sandY(.28) - Math.abs(Math.sin(time * 9)) * 2 * U;
  ctx.fillStyle = rgba(tint([218, 88, 58])); glyph('蟹', cx, cy, 44 * U, Math.sin(time * 9) * .04, 1.1, .9, true);
  hit('crab', cx, cy, 30 * U, .8);
  ctx.fillStyle = rgba(tint([244, 150, 140]));
  for (const s of reef.shrimp) {
    if (time > s.next) { s.dartAt = time; s.next = time + 4 + R() * 5; }
    const e1 = clamp((time - s.dartAt) / .25, 0, 1), back = clamp((time - s.dartAt - .25) / 2.2, 0, 1);
    const off = -60 * U * (1 - Math.pow(1 - e1, 3)) * (1 - back);
    const x = s.x * W + off + Math.sin(time * .8 + s.ph) * 8 * U, y = FLOOR - s.v * (FLOOR - SURF) + Math.cos(time * 1.1 + s.ph) * 6 * U;
    glyph('虾', x, y, 22 * U, Math.sin(time * 4 + s.ph) * .08, 1, 1, true);
    hit('shrimp', x, y, 18 * U, .8);
  }

  /* seahorses */
  ctx.fillStyle = rgba(tint([242, 192, 72]));
  for (const s of reef.seahorses) {
    const x = s.x * W + Math.sin(time * .3 + s.ph) * 8 * U, y = SURF + (FLOOR - SURF) * s.y + Math.sin(time * .9 + s.ph) * 10 * U;
    glyph('马', x, y, 34 * U, Math.sin(time * .6 + s.ph) * .12, 1, 1, true);
    hit('seahorse', x, y, 24 * U, .8);
  }

  /* shark */
  const sh = reef.shark;
  sh.x += sh.dir * .028 * dt;
  if (sh.x > 1.25) { sh.dir = -1; sh.y = .22 + R() * .3; } else if (sh.x < -.25) { sh.dir = 1; sh.y = .22 + R() * .3; }
  const shx = sh.x * W, shy = SURF + (FLOOR - SURF) * sh.y + Math.sin(time * .7) * 12 * U;
  wriggle('鲨', rgba(tint([92, 108, 124])), shx, shy, 130 * U, 4 * U, .04, time * 3 * sh.dir, 1, true);
  hit('shark', shx, shy, 60 * U, .7);

  /* turtle */
  const tu = reef.turtle;
  tu.x += tu.dir * .018 * dt;
  if (tu.x < -.2) tu.x = 1.2; if (tu.x > 1.2) tu.x = -.2;
  const tux = tu.x * W, tuy = SURF + (FLOOR - SURF) * (tu.y + Math.sin(time * .3) * .05);
  tu.fold = tu.fold || {}; foldTick(tu.fold, 14, 28);
  const tcol = tint([112, 136, 84]);
  foldGlyph('龟', tux, tuy, 78 * U, tu.fold, [tcol, tint([214, 190, 96])], { rot: Math.sin(time * .8) * .08, sx: 1 + .05 * Math.sin(time * 2), center: true, flip: tu.dir < 0, style: rgba(tcol), foldScale: 1.35 });
  hit('turtle', tux, tuy, 44 * U, .8);

  /* reef fish that swim alone */
  const so = reef.solo;
  so.manta.x += so.manta.dir * .02 * dt;
  if (so.manta.x > 1.2) so.manta.dir = -1; else if (so.manta.x < -.2) so.manta.dir = 1;
  const mrx = so.manta.x * W, mry = SURF + (FLOOR - SURF) * so.manta.y + Math.sin(time * .5) * 10 * U;
  ctx.fillStyle = rgba(tint([150, 136, 120]));
  glyph('鳐', mrx, mry, 70 * U, Math.sin(time * .5) * .05, 1.3, .7 + .3 * Math.sin(time * 2.2), true);
  hit('manta', mrx, mry, 38 * U, .8);
  const pf = so.puffer, near = Math.hypot(pf.x * W - shx, SURF + (FLOOR - SURF) * pf.y - shy) < 220 * U;
  if (near && time - pf.inflateAt > 4) pf.inflateAt = time;
  const it = time - pf.inflateAt, inf = it >= 0 && it < 4 ? Math.min(1, it / .35) * Math.min(1, (4 - it) / .6) : 0;
  const pfx = (pf.x + Math.sin(time * .15) * .05) * W, pfy = SURF + (FLOOR - SURF) * pf.y + Math.sin(time * .7) * 8 * U, pfs = 30 * U * (1 + inf * .9);
  if (inf > .3) { ctx.strokeStyle = rgba(tint([210, 180, 110]), inf); ctx.lineWidth = 1.5; for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; ctx.beginPath(); ctx.moveTo(pfx + Math.cos(a) * pfs * .45, pfy + Math.sin(a) * pfs * .45); ctx.lineTo(pfx + Math.cos(a) * pfs * .62, pfy + Math.sin(a) * pfs * .62); ctx.stroke(); } }
  ctx.fillStyle = rgba(tint([226, 196, 100]));
  glyph('鲀', pfx, pfy, pfs, Math.sin(time * 1.2) * .08 * (1 - inf), 1 + inf * .25, 1 + inf * .25, true);
  hit('puffer', pfx, pfy, pfs * .55, .7);
  const lf = so.lion, lfx = (lf.x + Math.sin(time * .2) * .03) * W, lfy = SURF + (FLOOR - SURF) * lf.y + Math.sin(time * .6) * 6 * U;
  ctx.strokeStyle = rgba(tint([236, 170, 150]), .8); ctx.lineWidth = 1.4;
  for (let i = 0; i < 9; i++) { const a = PI * .6 + i / 8 * PI * .8 + Math.sin(time * 2 + i) * .08; ctx.beginPath(); ctx.moveTo(lfx, lfy); ctx.lineTo(lfx + Math.cos(a) * 34 * U, lfy + Math.sin(a) * 30 * U - 6 * U); ctx.stroke(); }
  ctx.fillStyle = clownPattern(tint([200, 60, 50]), tint([250, 236, 220]), tint([120, 30, 30]));
  glyph('鲉', lfx, lfy, 34 * U, Math.sin(time * .6) * .06, 1, 1, true);
  hit('lionfish', lfx, lfy, 24 * U, .8);
  const tn = so.tuna;
  if (tn.x > -.25 && tn.x < 1.25) tn.x += tn.dir * .14 * dt;
  else if ((tn.next -= dt) < 0) { tn.dir = R() < .5 ? 1 : -1; tn.x = tn.dir > 0 ? -.2 : 1.2; tn.y = .18 + R() * .3; tn.next = 30 + R() * 25; }
  if (tn.x > -.25 && tn.x < 1.25) {
    const tx2 = tn.x * W, ty2 = SURF + (FLOOR - SURF) * tn.y + Math.sin(time * 3) * 3 * U;
    const tg2 = ctx.createLinearGradient(0, -50, 0, 50); tg2.addColorStop(0, rgba(tint([30, 50, 110]))); tg2.addColorStop(.55, rgba(tint([150, 170, 200]))); tg2.addColorStop(1, rgba(tint([230, 236, 244])));
    ctx.fillStyle = tg2; glyph('鲔', tx2, ty2, 58 * U, 0, 1.35 + .05 * Math.sin(time * 14), .85, true);
    hit('tuna', tx2, ty2, 32 * U, .8);
  }

  const bf = so.bigfish || (so.bigfish = { x: .62, y: .5, dir: -1, fold: {} });
  bf.x += bf.dir * .015 * dt; if (bf.x > 1.1) bf.dir = -1; else if (bf.x < -.1) bf.dir = 1;
  foldTick(bf.fold, 9, 20);
  const bfx = bf.x * W, bfy = SURF + (FLOOR - SURF) * (bf.y + Math.sin(time * .4) * .05), bcol = tint([255, 170, 60]);
  foldGlyph('鱼', bfx, bfy, 52 * U, bf.fold, [bcol, tint([40, 40, 60])], { center: true, flip: bf.dir < 0, style: rgba(bcol), foldScale: 1.45, sx: 1 + .06 * Math.sin(time * 9) });
  hit('fish', bfx, bfy, 30 * U, .8);

  /* fish schools */
  for (const s of reef.schools) {
    const lx = W * (.5 + .4 * Math.sin(time * s.a + s.ph)), ly = SURF + (FLOOR - SURF) * (s.y + .12 * Math.sin(time * s.b + s.ph * 1.3));
    const base = tint(s.col), alt = tint(s.alt);
    for (const f of s.fish) {
      if (f.x < 0) { f.x = lx + f.ox * U; f.y = ly + f.oy * U; }
      let ax = (lx + f.ox * U - f.x) * 1.4 - f.vx * 1.1 + Math.sin(time * 2 + f.ph) * 30 * U;
      let ay = (ly + f.oy * U - f.y) * 1.4 - f.vy * 1.1 + Math.cos(time * 1.7 + f.ph) * 20 * U;
      const dx = f.x - shx, dy = f.y - shy, d = Math.hypot(dx, dy) || 1;
      if (d < 210 * U) { const k = (1 - d / (210 * U)) * 2600 * U; ax += dx / d * k; ay += dy / d * k; }
      f.vx += ax * dt; f.vy += ay * dt;
      const spd = Math.hypot(f.vx, f.vy), mxs = 330 * U;
      if (spd > mxs) { f.vx *= mxs / spd; f.vy *= mxs / spd; }
      f.x += f.vx * dt; f.y = clamp(f.y + f.vy * dt, SURF + 16 * U, FLOOR - 8 * U);
      ctx.fillStyle = s.mixed ? rgba(tint(f.c)) : rgba(f.alt ? alt : base);
      glyph(s.ch, f.x, f.y, s.size * U, clamp(f.vy / (Math.abs(f.vx) + 80 * U), -.4, .4) * Math.sign(f.vx || 1), 1 + .07 * Math.sin(time * 12 + f.ph), 1, true);
      hit(s.id, f.x, f.y, Math.max(14, s.size * .75) * U, .9);
    }
  }

  /* jellyfish */
  for (const j of reef.jellies) {
    const p = Math.sin(time * 1.5 + j.ph);
    j.y -= (Math.max(0, p) * .028 - .009) * dt;
    if (j.y < -.08) { j.y = .95; j.x = .05 + R() * .9; }
    const x = j.x * W + Math.sin(time * .2 + j.ph) * 20 * U, y = SURF + (FLOOR - SURF) * j.y, sc = U;
    const col = tint(j.col, .9);
    if (night > .05) { ctx.shadowColor = rgba(j.col, .9); ctx.shadowBlur = 18 * night; }
    ctx.strokeStyle = rgba(col, .55); ctx.lineWidth = 1.6;
    for (let t = 0; t < 5; t++) {
      ctx.beginPath();
      let px = x + (t - 2) * 6 * sc, py = y + 12 * sc; ctx.moveTo(px, py);
      for (let i = 1; i <= 8; i++) { px = x + (t - 2) * (6 + i * .6) * sc + Math.sin(time * 2 + t + i * .6) * 6 * sc; py = y + 12 * sc + i * 9 * sc * (1 - p * .08); ctx.lineTo(px, py); }
      ctx.stroke();
    }
    ctx.fillStyle = rgba(col, .85);
    glyph('母', x, y, 44 * sc, 0, 1.1 - p * .09, .9 + p * .1, true);
    ctx.shadowBlur = 0;
    hit('jelly', x, y + 16 * sc, 36 * sc, .7);
  }

  /* front kelp */
  for (const k of reef.kelpFront) drawKelp(k, rgba(tint(mix(P.kelp, [30, 40, 20], .45), .8)));

  /* bubbles */
  reef.nextBub -= dt;
  if (reef.nextBub < 0) {
    reef.nextBub = 1 + R() * 1.4;
    const src = [[ax, ay - 20 * U], [orx + 30 * U, FLOOR - 40 * U], [(.1 + R() * .8) * W, FLOOR - 10 * U]][R() * 3 | 0];
    reef.bubbles.push({ x: src[0], y: src[1], r: (2 + R() * 4) * U, vy: -(40 + R() * 40) * U, ph: R() * TAU, g: R() < .15 });
  }
  ctx.lineWidth = 1;
  for (let i = reef.bubbles.length - 1; i >= 0; i--) {
    const b = reef.bubbles[i];
    b.y += b.vy * dt; b.x += Math.sin(time * 3 + b.ph) * 12 * U * dt;
    if (b.y < SURF) { reef.bubbles.splice(i, 1); continue; }
    if (b.g) {
      ctx.fillStyle = rgba(WHITE, .7); glyph('泡', b.x, b.y, 18 * U, 0, 1, 1, true);
      hit('bubble', b.x, b.y, 16 * U, .8);
    } else {
      ctx.strokeStyle = rgba(WHITE, .6); ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
      ctx.fillStyle = rgba(WHITE, .7); ctx.beginPath(); ctx.arc(b.x - b.r * .35, b.y - b.r * .35, b.r * .25, 0, TAU); ctx.fill();
    }
  }

  /* ink cloud */
  for (let i = reef.ink.length - 1; i >= 0; i--) {
    const k = reef.ink[i]; k.life -= dt; if (k.life <= 0) { reef.ink.splice(i, 1); continue; }
    k.x += k.vx * dt; k.y += k.vy * dt; k.vx *= .97; k.vy *= .97;
    const f = 1 - k.life / k.max;
    ctx.fillStyle = `rgba(14,12,20,${(1 - f) * .75})`;
    glyph('墨', k.x, k.y, k.s * (1 + f * 1.6), f * .6, 1, 1, true);
    hit('ink', k.x, k.y, k.s * .8, .9);
  }

  /* plankton, glowing at night */
  for (const p of reef.plankton) {
    p.y -= .004 * dt; if (p.y < 0) p.y = 1;
    const x = (p.x + Math.sin(time * .3 + p.ph) * .01) * W, y = SURF + (FLOOR - SURF) * p.y;
    const a = .12 + night * .75 * Math.pow(Math.sin(time * 1.2 + p.ph) * .5 + .5, 2);
    ctx.fillStyle = night > .3 ? `rgba(140,240,255,${a})` : rgba(WHITE, a);
    ctx.beginPath(); ctx.arc(x, y, 1.3 * p.s, 0, TAU); ctx.fill();
  }

  /* depth vignette */
  const vg = ctx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .3, W / 2, H * .45, Math.max(W, H) * .8);
  vg.addColorStop(0, 'rgba(0,10,30,0)'); vg.addColorStop(1, `rgba(0,8,24,${.4 + night * .2})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function drawKelp(k, color) {
  const seg = k.s * U * .78, x0 = k.x * W;
  ctx.fillStyle = color;
  let px = x0, py = FLOOR + 10 * U;
  for (let i = 0; i < k.n; i++) {
    const nx = x0 + Math.sin(time * .9 + k.ph - i * .35) * i * 2.2 * U;
    const ny = py - seg;
    glyph('藻', (px + nx) / 2, (py + ny) / 2, k.s * U, Math.atan2(nx - px, seg) * .9, 1, 1, true);
    hit('kelp', (px + nx) / 2, (py + ny) / 2, k.s * U * .5, 1.1);
    px = nx; py = ny;
  }
}

function drawCoral(c, tint) {
  const k = U * c.s, bx = c.x * W, by = FLOOR + 8 * U;
  const pts = [];
  for (let i = 0; i < c.segs.length; i++) {
    const sg = c.segs[i];
    const parent = sg.parent < 0 ? null : pts[sg.parent];
    const sway = (parent ? parent.sway : 0) + Math.sin(time * .7 + sg.ph) * .035;
    const ang = sg.ang + sway;
    const sx = parent ? parent.ex : bx, sy = parent ? parent.ey : by;
    const ex = sx + Math.cos(ang) * sg.len * k, ey = sy + Math.sin(ang) * sg.len * k;
    pts.push({ ex, ey, sway });
    ctx.fillStyle = rgba(tint(mix(c.col, WHITE, sg.depth * .07)));
    glyph(sg.ch, (sx + ex) / 2, (sy + ey) / 2, sg.len * k * 1.15, ang + PI / 2, 1, 1, true);
    hit('coral', (sx + ex) / 2, (sy + ey) / 2, sg.len * k * .55, 1.1);
  }
}

  const gr = ctx.createLinearGradient(0, HOR, 0, H);
  gr.addColorStop(0, rgba(P.gTop)); gr.addColorStop(1, rgba(P.gBot));
  ctx.fillStyle = gr; ctx.fillRect(0, HOR, W, H - HOR);
  const hz = ctx.createLinearGradient(0, HOR - 40 * U, 0, HOR + 36 * U);
  hz.addColorStop(0, rgba(P.haze, 0)); hz.addColorStop(0.55, rgba(P.haze, 0.35)); hz.addColorStop(1, rgba(P.haze, 0));
  ctx.fillStyle = hz; ctx.fillRect(0, HOR - 40 * U, W, 76 * U);

  /* wind */
  if (!reduce) {
    gust.next -= dt;
    if (!gust.on && gust.next < 0) { gust.on = true; gust.x = -200; }
    if (gust.on) { gust.x += W * 0.2 * dt; if (gust.x > W + 200) { gust.on = false; gust.next = 28 + R() * 16; } }
  }
  const windAt = x => 0.18 * Math.sin(time * 0.5 + x * 0.004) + (gust.on ? 0.9 * Math.exp(-Math.pow((x - gust.x) / (W * 0.12), 2)) : 0);

  /* ground objects, sorted by depth, merged with grass */
  const objs = [...trees, water, ...animals, ...flowers].sort((a, b) => a.g - b.g);
  const zp = zebraPattern(mix(P.ink, [238, 230, 214], lit * 0.95), mix(P.ink, [28, 22, 20], lit));
  const gp = giraffePattern(mix(P.ink, [226, 190, 120], lit * 0.9), mix(P.ink, [140, 84, 38], lit * 0.9));
  const grassCols = Array.from({ length: 14 }, (_, i) => mix(P.grassFar, P.grassNear, clamp(i / 12, 0, 1)));
  const grassR = 150 * U;

  let gi = 0;
  const drawGrassUntil = (gMax) => {
    for (; gi < grass.length && grass[gi].g <= gMax; gi++) {
      const b = grass[gi], s = ds(b.g), px = b.x * W, py = gy(b.g), sz = b.s * U * s;
      let ang = Math.sin(time * 1.2 + b.x * 11 + b.ph) * 0.07 + windAt(px) * 0.38;
      const dx = px - mx, dy = py - sz * 0.5 - my, d = Math.hypot(dx, dy);
      if (d < grassR) ang += Math.sign(dx || 1) * (1 - d / grassR) * 0.7;
      const c = grassCols[clamp(Math.round(b.g * 12), 0, 13)];
      ctx.fillStyle = rgba([c[0] * b.shade, c[1] * b.shade, c[2] * b.shade]);
      glyph('草', px, py + sz * 0.08, sz, ang);
    }
  };

  for (const o of objs) {
    drawGrassUntil(o.g);
    if (o.type === 'tree') drawTree(o, P, lit, windAt);
    else if (o.type === 'water') drawWater(o, P, night, dt);
    else if (o.type === 'flower') drawFlower(o, P, lit);
    else drawAnimal(o, P, lit, night, dt, zp, gp);
  }
  drawGrassUntil(9);

  /* dust */
  ctx.fillStyle = rgba(mix(P.gTop, P.haze, 0.4));
  for (let i = dust.length - 1; i >= 0; i--) {
    const d = dust[i];
    d.life -= dt; if (d.life <= 0) { dust.splice(i, 1); continue; }
    d.x += d.vx * dt; d.y += d.vy * dt; d.vy *= 0.98;
    ctx.globalAlpha = 0.55 * d.life / d.max;
    glyph('尘', d.x, d.y, d.s * (1.6 - d.life / d.max), 0, 1, 1, true);
    hit('dust', d.x, d.y, d.s * .6, 1.2);
  }
  ctx.globalAlpha = 1;

  /* roars + wind ripples */
  for (let i = roars.length - 1; i >= 0; i--) {
    const r = roars[i];
    r.life -= dt; if (r.life <= 0) { roars.splice(i, 1); continue; }
    if (r.g) r.vy += r.g * dt;
    r.x += r.vx * dt; r.y += r.vy * dt;
    const f = 1 - r.life / r.max;
    ctx.fillStyle = rgba(r.col || (r.ch === '吼' ? mix([255, 230, 180], P.glow, 0.4) : WHITE), (1 - f) * (r.a ?? (r.ch === '吼' ? 0.9 : 0.5)));
    glyph(r.ch, r.x, r.y, r.s + r.grow * f, 0, 1, 1, true);
    const rid = { '吼': 'roar', '风': 'wind', '水': 'water', '叶': 'leaf' }[r.ch];
    if (rid) hit(rid, r.x, r.y, Math.max(8 * U, (r.s + r.grow * f) * .6));
  }

  /* gust glyph */
  if (gust.on) {
    ctx.fillStyle = rgba(WHITE, 0.16 + night * 0.05);
    for (let i = 0; i < 3; i++) {
      const x = gust.x - i * 70 * U, y = gy(0.55) - i * 12 * U + Math.sin(time * 3 + i) * 6 * U;
      glyph('风', x, y, (46 - i * 10) * U, 0.15, 1.3, 1, true);
    }
    hit('wind', gust.x, gy(0.55), 50 * U, 0.9);
  }

  /* fireflies */
  if (night > 0.05) {
    ctx.shadowColor = 'rgba(214,240,120,0.9)';
    ctx.shadowBlur = 12;
    for (const f of fireflies) {
      f.x += f.vx * dt; if (f.x < -0.02) f.x = 1.02; if (f.x > 1.02) f.x = -0.02;
      f.bob += dt * 0.8;
      const a = night * Math.pow(Math.max(0, Math.sin(time * 1.3 + f.ph)), 3);
      if (a < 0.03) continue;
      const x = f.x * W, y = gy(f.g) - 40 * U * ds(f.g) + Math.sin(f.bob) * 14 * U;
      ctx.fillStyle = `rgba(222,244,140,${a})`;
      glyph('萤', x, y, 12 * U * ds(f.g), 0, 1, 1, true);
      hit('firefly', x, y, 14 * U);
    }
    ctx.shadowBlur = 0;
  }

  /* vignette */
  const vg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.35, W / 2, H * 0.55, Math.max(W, H) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${0.35 + night * 0.2})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  }
  drawFade(dt);

  /* hover card */
  const canHover = matchMedia('(hover: hover)').matches;
  if (!lockId && mx > -999 && (canHover || tapHold > 0)) {
    const id = pick(mx, my);
    if (id && (!AMBIENT.has(id) || tapHold > 0)) { lockId = id; lockX = mx; lockY = my; }
    else showCard(id);
    tapHold = 0;
  } else if (!lockId) showCard(null);
  if (lockId) showCard(lockId);
  syncPhase();
}

function drawFlower(f, P, lit) {
  foldTick(f.fold, 9, 22);
  const s = ds(f.g), x = f.x * W, y = gy(f.g), sz = 34 * U * s;
  const petal = mix(P.ink, [240, 120, 170], .3 + lit * .7), stem = mix(P.ink, [110, 150, 60], .3 + lit * .7);
  foldGlyph('花', x, y, sz, f.fold, [petal, petal, [250, 210, 80], stem], { rot: Math.sin(time * 1.3 + f.x * 20) * .06, style: rgba(petal), foldScale: 1.35 });
  hit('flower', x, y - sz * .55, sz * .65, .8);
}

function drawTree(t, P, lit, windAt) {
  const k = U * ds(t.g) * t.s, x = t.x * W, y = gy(t.g);
  const trunk = mix(P.ink, [92, 66, 46], lit * 0.85);
  ctx.fillStyle = rgba(P.ink, 0.22);
  ctx.beginPath(); ctx.ellipse(x, y, 120 * k, 10 * k, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = rgba(trunk);
  let ty = y;
  [[62, 0, 0.03], [54, 6, -0.05], [46, -3, 0.08]].forEach(([s, dx, r]) => { glyph('木', x + dx * k, ty, s * k, r); ty -= s * k * 0.8; });
  glyph('木', x - 34 * k, ty + 16 * k, 38 * k, -0.7);
  glyph('木', x + 36 * k, ty + 14 * k, 38 * k, 0.65);
  const cy = ty - 4 * k, w = windAt(x);
  for (const l of t.leaves) {
    const c = mix(P.ink, mix([74, 88, 40], [120, 132, 60], l.lift), lit * 0.85);
    ctx.fillStyle = rgba(c);
    const sway = Math.sin(time * 1.4 + l.ph) * 2 * k + w * 6 * k * l.lift;
    glyph('叶', x + l.dx * k + sway, cy + l.dy * k, l.s * k, Math.sin(time + l.ph) * 0.08, 1.2, 0.9, true);
  }
  hit('tree', x, cy - 10 * k, 120 * k, 1.1);
  hit('tree', x, y - 60 * k, 40 * k, 1.1);
}

function drawWater(o, P, night, dt) {
  const x = o.x * W, y = gy(o.g), s = ds(o.g);
  const rx = 170 * U * s * 1.3, ry = rx * 0.17;
  ctx.save();
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
  const wg = ctx.createLinearGradient(0, y - ry, 0, y + ry);
  wg.addColorStop(0, rgba(mix(P.water, P.skyTop, 0.35)));
  wg.addColorStop(1, rgba(mix(P.water, P.gBot, 0.3)));
  ctx.fillStyle = wg; ctx.fill();
  ctx.strokeStyle = rgba(P.gBot, 0.35); ctx.lineWidth = 2; ctx.stroke();
  ctx.clip();
  const light = mix(P.water, WHITE, 0.55);
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 11; c++) {
      const px = x - rx + (c + 0.5 + (r % 2) * 0.5) * rx * 2 / 11 + Math.sin(time * 0.8 + r + c) * 4 * U;
      const py = y - ry + (r + 0.8) * ry * 2 / 4.2;
      ctx.fillStyle = rgba(light, 0.22 + 0.2 * Math.sin(time * 2 + c * 1.7 + r));
      glyph('水', px, py, 16 * U * s * (0.8 + r * 0.12), 0, 1.4, 0.55, true);
    }
  }
  // hippo: 河马, half submerged
  hippo.ph += dt;
  const hx = x + Math.sin(hippo.ph * 0.12) * rx * 0.35 - rx * 0.1, hy = y + ry * 0.15;
  const hs = 30 * U * s, bob = Math.sin(hippo.ph * 1.2) * 2 * U;
  ctx.fillStyle = rgba(mix(P.ink, [118, 96, 104], clamp(1 - night, 0, 1) * 0.6));
  ctx.save();
  ctx.beginPath(); ctx.rect(hx - hs * 2, hy - hs * 2, hs * 4, hs * 2 - hs * 0.42); ctx.clip();
  glyph('河', hx - hs * 0.5, hy + bob, hs);
  glyph('马', hx + hs * 0.5, hy + bob, hs);
  ctx.restore();
  ctx.strokeStyle = rgba(light, 0.35); ctx.lineWidth = 1;
  const rp = (hippo.ph * 0.6) % 1;
  ctx.beginPath(); ctx.ellipse(hx, hy - hs * 0.42, hs * (1.1 + rp * 0.9), hs * (0.18 + rp * 0.15), 0, 0, TAU); ctx.globalAlpha = 1 - rp; ctx.stroke(); ctx.globalAlpha = 1;
  ctx.restore();
  hit('hippo', hx, hy - hs * 0.6, hs * 1.1, 0.8);
  hit('water', x, y, rx * 0.9, 1.4);
}

function drawAnimal(a, P, lit, night, dt, zp, gp) {
  const s = ds(a.g), sz = a.size * U * s;
  const mult = (a.spook > 0 ? 3 : 1) * (reduce ? 0.4 : 1);
  a.spook = Math.max(0, a.spook - dt);
  if (a.kind === 'zebra' || a.kind === 'elephant') {
    a.walkT = (a.walkT ?? 4 + R() * 8) - dt;
    if (a.spook > 0) a.pauseT = 0;
    else if (a.walkT < 0 && !(a.pauseT > 0)) { a.pauseT = 3 + R() * 4; a.walkT = 7 + R() * 10; }
    if (a.pauseT > 0) a.pauseT -= dt;
    a.grazing = a.pauseT > 0;
  }
  if (!a.grazing) a.x += a.dir * a.speed * dt * mult;
  if (a.x > 1.12) a.x = -0.12; if (a.x < -0.12) a.x = 1.12;
  a.phase += dt * a.gait * (a.spook > 0 ? 2 : 1) * (a.speed || a.kind !== 'giraffe' ? 1 : 0.5) * (a.grazing ? .15 : 1);
  const x = a.x * W, y = gy(a.g);

  // ground shadow
  ctx.fillStyle = rgba([0, 0, 0], 0.2 * (1 - night * 0.5));
  ctx.beginPath(); ctx.ellipse(x, y - sz * 0.03, sz * (a.kind === 'giraffe' ? 0.35 : 0.45), sz * 0.07, 0, 0, TAU); ctx.fill();

  if (a.kind === 'giraffe') {
    const bob = a.speed ? -Math.abs(Math.sin(a.phase)) * sz * 0.03 : 0;
    const sway = Math.sin(time * 0.7 + a.phase) * sz * 0.07 + (a.browse ? Math.sin(time * 0.33) * sz * 0.05 : 0);
    const dip = a.browse ? Math.max(0, Math.sin(time * 0.25 + 1)) * sz * 0.08 : 0;
    ctx.fillStyle = gp;
    glyph('鹿', x, y + bob, sz);
    glyph('颈', x + sway * 0.45, y + bob - sz * 0.8 + dip * 0.4, sz * 0.72, sway / sz * 0.5);
    glyph('长', x + sway, y + bob - sz * 0.8 - sz * 0.62 + dip, sz * 0.64, sway / sz * 0.9);
    if (a.browse) {
      a.nib = (a.nib ?? 2) - dt;
      if (a.nib < 0) { a.nib = 2.4 + R() * 2; const hx = x + sway, hy = y + bob - sz * 1.42 + dip - sz * .45; roars.push({ ch: '叶', x: hx + 46 * U, y: hy - 8 * U, vx: -44 * U, vy: 8 * U, life: 1, max: 1, s: 16 * U, grow: -8 * U, col: [110, 140, 50], a: 1 }); }
    }
    hit('giraffe', x + sway * 0.5, y - sz * 1.05, sz * 1.1, 0.8);
    return;
  }

  let bob = -Math.abs(Math.sin(a.phase)) * sz * 0.04, rot = Math.sin(a.phase) * 0.035 * a.dir, sx = 1, sy = 1;
  if (a.kind === 'gazelle') {
    const h = a.spook > 0 ? 1.0 : 0.3;
    bob = -Math.max(0, Math.sin(a.phase)) * sz * h;
    rot = Math.cos(a.phase) * 0.12 * a.dir;
  }
  if (a.grazing) { bob = 0; rot = a.kind === 'zebra' ? .12 * a.dir : 0;
    if (a.kind === 'elephant' && R() < dt * 1.2) for (let k = 0; k < 5; k++) roars.push({ ch: '水', x: x + a.dir * sz * .38, y: y - sz * .55, vx: -a.dir * (30 + R() * 60) * U, vy: -(100 + R() * 60) * U, g: 190 * U, life: 1.3, max: 1.3, s: 12 * U, grow: 4 * U, col: [210, 235, 255], a: .85 }); }
  if (a.kind === 'lion') {
    // A day in the life: rest, stalk the gazelles, sprint, give up, walk home.
    const h = a.hunt || (a.hunt = { state: 'rest', until: time + 50 + R() * 20, home: a.x, g0: a.g });
    const prey = animals.filter(b => b.kind === 'gazelle');
    const tgt = prey.reduce((m, b) => Math.abs(b.x - a.x) < Math.abs(m.x - a.x) ? b : m, prey[0]);
    if (h.state === 'rest' && time > h.until && !(a.roaring > 0) && !reduce) { h.state = 'stalk'; h.until = time + 7; }
    if (h.state === 'stalk') {
      a.dir = Math.sign(tgt.x - a.x) || 1; a.x += a.dir * .012 * dt; a.g += (tgt.g + .06 - a.g) * dt * .25;
      if (time > h.until) { h.state = 'chase'; h.until = time + 2.5; animals.forEach(b => { if (b.kind === 'gazelle' || b.kind === 'zebra') { b.spook = 4; b.dir = b.x > a.x ? 1 : -1; } }); }
    } else if (h.state === 'chase') { a.x += a.dir * .07 * dt; if (time > h.until) h.state = 'return'; }
    else if (h.state === 'return') {
      a.dir = Math.sign(h.home - a.x) || 1; a.x += a.dir * .02 * dt; a.g += (h.g0 - a.g) * dt * .4;
      if (Math.abs(a.x - h.home) < .01) { h.state = 'rest'; h.until = time + 75 + R() * 35; a.g = h.g0; }
    }
    if (h.state === 'rest') {
      bob = 0; rot = 0;
      const br = Math.sin(a.phase) * 0.025;
      sx = 1.08 + br; sy = 0.92 - br;
      if (a.roaring > 0) { a.roaring -= dt; sy += 0.12 * Math.sin((1.2 - a.roaring) / 1.2 * PI); }
      if (time > a.roarAt && !reduce) roar(a);
    } else {
      const fast = h.state === 'chase';
      a.phase += dt * (fast ? 11 : 3.5);
      const s2 = Math.sin(a.phase);
      bob = -Math.abs(s2) * sz * (fast ? .12 : .02); rot = s2 * (fast ? .08 : .03) * a.dir;
      sx = h.state === 'stalk' ? 1.15 : 1.04; sy = h.state === 'stalk' ? .82 : 1;
    }
  }
  if (a.kind === 'zebra' && (a.spook > 0 || R() < 0.01) && R() < (a.spook > 0 ? 0.35 : 0.2)) {
    dust.push({ x: x - a.dir * sz * 0.3, y: y - sz * 0.05, vx: -a.dir * (20 + R() * 30) * U, vy: -(10 + R() * 20) * U, life: 1.4, max: 1.4, s: sz * 0.28 });
  }
  if (a.kind === 'zebra') ctx.fillStyle = zp;
  else ctx.fillStyle = rgba(mix(P.ink, a.col, lit * 0.9));
  if (a.kind === 'elephant') {
    a.fold = a.fold || {}; foldTick(a.fold, 16, 34);
    const ec = mix(P.ink, a.col, lit * 0.9);
    foldGlyph('象', x, y + bob, sz, a.fold, [ec, mix(ec, P.ink, .25)], { rot, sx, sy, flip: a.dir < 0, style: rgba(ec), foldScale: 1.2 });
  } else glyph(a.ch, x, y + bob, sz, rot, sx, sy);
  if (a.kind === 'elephant' && a.size < 70) hit('elephant', x, y - sz * 0.5, sz * 0.6, 0.8);
  else hit(a.kind, x, y + bob - sz * 0.5, sz * 0.6, 0.8);
}

/* ---------- boot ---------- */
resize();
addEventListener('resize', resize);
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  frame(dt);
  requestAnimationFrame(loop);
}
const chars = '日月星光云山雪丘草树木叶象长颈鹿斑马狮吼羚鸟鹫水河犀萤风尘珊瑚礁鱼鲨鲸龟母章墨蟹虾贝葵藻泡沙石波海竹个介笋熊猫猴鹤蝶蛙呱鸡蛇虎啸雾苔冰熊企豹狐鼠鸮鸥喷裂';
Promise.race([
  document.fonts ? document.fonts.load(`100px "Ma Shan Zheng"`, chars) : Promise.resolve(),
  new Promise(r => setTimeout(r, 2500)),
]).finally(() => { gcache.clear(); requestAnimationFrame(t => { last = t; loop(t); }); });
setWorld((location.hash || '').slice(1) || 'savanna', true);
frame(0);
document.fonts && document.fonts.ready.then(() => gcache.clear());
})();
</script>

</body>
